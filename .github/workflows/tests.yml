name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Add-on tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python syntax
        run: python -m py_compile service.py failover.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/wg-fr-full-routing.sh
          sh -n scripts/wg-split-routing.sh

      - name: Validate Kodi manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('addon.xml').getroot()
          assert root.attrib['id'] == 'service.therandtv.routing'
          platform = root.findtext('./extension[@point="xbmc.addon.metadata"]/platform')
          assert platform == 'linux'
          PY
